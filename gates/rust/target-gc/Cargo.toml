# target-gc — evict idle Cargo build directories across a whole machine, only
# when the disk needs the space, and never one a build or a program is using.
#
# `target-sweep` prunes scratch INSIDE one build directory. This is the other
# half: whole build directories that nobody has touched in weeks. Measured on one
# laptop on 2026-09-28: 38 Cargo build directories, 152 GB by `du`, and a manual
# cleanup of seven of them took free space from 9.3 GiB to 122 GiB.
#
# Why not an existing tool, checked against source on the same day:
#   - two cleaners test `<target>/.cargo-lock`, a file Cargo never creates (the
#     lock is per profile, `<target>/<profile>/.cargo-lock`), so their "is a build
#     running" check can never fire;
#   - the most complete one matches build directories by NAME, and on this
#     machine planned to delete a JavaScript package's own `target/` source
#     directory inside `node_modules`;
#   - the rest have no liveness check at all.
#
# So a Cargo build directory is identified by the `CACHEDIR.TAG` Cargo writes
# into it, never by its name.
#
# One dependency beyond the workspace: `serde_json`, for the run record the
# session hook reads. Processes and free space come from `lsof`, `/proc` and
# `df`, bounded and reaped (rules/process-ownership.md).
[package]
name = "target-gc"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "target_gc"
path = "src/lib.rs"

[[bin]]
name = "target-gc"
path = "src/main.rs"

[dependencies]
gates-config.workspace = true
serde_json.workspace = true
target-sweep = { path = "../target-sweep" }

[lints]
workspace = true

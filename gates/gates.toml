# gates.toml — a worked example. Copy it to your repo root and edit the paths.
#
# Read by `staged-scope` and `check-test-hangs`. Both fail LOUDLY when this file
# is missing or matches nothing, rather than passing by checking zero files: a
# gate that scans nothing prints the same tick as one that scans everything
# (rules/testing-gates.md).

# ── Scopes ───────────────────────────────────────────────────────────────────
# Each [scope.<name>] declares the paths whose change can break that scope's
# gates. `staged-scope` prints the names a diff touches; the hook switches on
# them and runs only those gates.
#
# Pattern shapes, in the order they are tried:
#   "dir/"        directory prefix — everything under it
#   "a/*/b"       glob, where `*` matches any run of characters
#   "Cargo.toml"  exact path — the ROOT manifest, not every nested one
#
# One file may belong to several scopes; that is a set, not a verdict. A shared
# lockfile legitimately triggers both halves of a monorepo.

[scope.backend]
paths = [
  "apps/api/",
  "crates/",
  "Cargo.toml",
  "Cargo.lock",
  "rust-toolchain.toml",
  # Build flags are hashed into every artifact's fingerprint, so a change here
  # can invalidate the whole build directory with no source file edited.
  ".cargo/config.toml",
]

[scope.frontend]
paths = [
  "apps/web/",
  "packages/",
  "package.json",
  "bun.lock",
  "turbo.json",
  "biome.json",
  "tsconfig.json",
]

[scope.workflow]
paths = [".github/", ".husky/", "gates/"]

# ── Inert paths ──────────────────────────────────────────────────────────────
# Paths that legitimately run NO gate. Everything matching neither a scope nor
# this list emits `unknown`, which the hook must expand to "run everything".
#
# That default-deny is the point of the whole file. Without it, a new top-level
# directory runs zero gates forever and nothing says so — which is exactly what
# happened to one repo's `apps/web/**`: 157 tracked files, no gate, for months.
[gates]
inert = [
  "docs/",
  "reports/",
  "media/",
  "*.md",
  "LICENSE",
  ".gitignore",
  ".dockerignore",
  ".env.example",
]

# ── Test-hang tiers ──────────────────────────────────────────────────────────
# Which checks apply to which trees. `sockets` rejects a real socket bind/connect
# in a test file; `sleeps` rejects a blocking thread sleep. Both honour an inline
# `// test-hang-allow: <reason>` on the line or the line directly above.

[test-hangs.backend]
paths  = ["apps/api/", "crates/"]
checks = ["sockets", "sleeps"]

# The second tier is the interesting one. A suite that stands up real test
# servers on ephemeral ports BY DESIGN turns the socket check into an
# allowlist-marking exercise with no bug behind it — but nothing about that
# justifies a real `thread::sleep`. Splitting the tiers keeps the sleep rule
# where a 40ms timing margin once failed CI on a loaded runner and blocked a
# deploy.
[test-hangs.services]
paths  = ["services/"]
checks = ["sleeps"]

# ── Tracker ids in source ────────────────────────────────────────────────────
# `check-no-id-refs` reads every tracked source file by default. Narrow it with
# `roots`, widen the shapes for your tracker. Markdown is never read: decision
# records and plans cite ids on purpose.
[id-refs]
roots      = ["apps/", "crates/", "packages/"]
shapes     = ["t-[0-9a-f]{4,}", "bd-[0-9a-z]{3,}"]
extensions = ["rs", "ts", "tsx", "svelte"]

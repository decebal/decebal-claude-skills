[workspace]
members = ["."]
resolver = "2"

[workspace.lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
bare_urls = "deny"

[package]
name = "skill-rank"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Rate installed Claude Code and Codex skills with TypeSafe Jev, fit the best into each listing budget, and search the rest"

[dependencies]
regex = "1"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
# Parses ~/.codex/config.toml before and after an edit: a file Codex cannot
# load breaks every Codex session.
toml = "1.0"
ureq = { version = "3", default-features = false, features = ["json", "tls"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "skill-rank"
path = "src/main.rs"

[lints]
workspace = true

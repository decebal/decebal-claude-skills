name: test-skills

on:
  push:
    paths:
      - "skills/**"
      - "tests/**"
      - "renovate.json"
      - ".github/workflows/test-skills.yml"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # web-video skill needs ffmpeg/ffprobe.
      - name: Install ffmpeg
        timeout-minutes: 5
        run: |
          apt=(-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          sudo apt-get "${apt[@]}" update
          sudo apt-get "${apt[@]}" install -y --no-install-recommends ffmpeg

      # uv provisions a Python + Pillow on the fly for the blog-image tests
      # (the test harness uses `uv run --with pillow`).
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run skill tests
        run: bash tests/run.sh

      - name: Check claude-seo Rust runtime
        run: |
          cargo fmt --check --manifest-path skills/claude-seo/scripts/Cargo.toml
          cargo clippy --locked --manifest-path skills/claude-seo/scripts/Cargo.toml --all-targets --all-features -- -D warnings
          cargo test --locked --manifest-path skills/claude-seo/scripts/Cargo.toml --all-targets --all-features

      - name: Check aso-lint Rust runtime
        run: |
          cargo fmt --check --manifest-path skills/aso-lint/scripts/Cargo.toml
          cargo clippy --locked --manifest-path skills/aso-lint/scripts/Cargo.toml --all-targets --all-features -- -D warnings
          cargo test --locked --manifest-path skills/aso-lint/scripts/Cargo.toml --all-targets --all-features

      - name: Check report-press Rust runtime
        run: |
          cargo fmt --check --manifest-path skills/report-press/scripts/Cargo.toml
          cargo clippy --locked --manifest-path skills/report-press/scripts/Cargo.toml --all-targets --all-features -- -D warnings
          cargo test --locked --manifest-path skills/report-press/scripts/Cargo.toml --all-targets --all-features
          cargo run --locked --manifest-path skills/report-press/scripts/Cargo.toml -- check skills/report-press/examples/explainer.md
